name: Temporary webclient input fix

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Patch webclient input handling
        run: |
          python3 .github/webclient_input_patch.py
          git diff --check
      - name: Compile webclient
        run: ant -noinput -buildfile build.xml compilejs
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/js/stendhal/Client.ts src/js/stendhal/ui/HTMLManager.ts src/js/stendhal/ui/ViewPort.ts src/js/stendhal/ui/component/ItemContainerImplementation.ts src/js/stendhal/ui/HeldObject.ts src/js/stendhal/ui/component/MiniMapComponent.ts src/js/stendhal/data/OutfitStore.ts
          git commit -m "Fix webclient touch and input handling"
          git push origin HEAD:master
