name: Fix webclient build generator

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  fix-generator:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Fix generated build module
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('buildtools/ant_modules/dist.xml')
          text = path.read_text(encoding='utf-8')
          old = '''\t\t\tstendhal.data.build = {
          \t\t\t\tversion: "${version}",
          \t\t\t\tbuild: "${datetime}",
          \t\t\t\tdist: "webclient"
          \t\t\t}
          
          \t\t\t//CI
          \t\t</echo>'''
          new = '''\t\t\tstendhal.data.build = {
          \t\t\t\tversion: "${version}",
          \t\t\t\tbuild: "${datetime}",
          \t\t\t\tdist: "webclient"
          \t\t\t};
          
          \t\t\t//CI
          \t\t\t}
          \t\t</echo>'''
          if text.count(old) != 1:
              raise SystemExit('Expected broken build module block exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Compile webclient
        run: ant -noinput -buildfile build.xml compilejs
      - name: Commit generator fix and remove helper workflow
        run: |
          rm .github/workflows/fix-webclient-build-generator.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add buildtools/ant_modules/dist.xml .github/workflows/fix-webclient-build-generator.yml
          git diff --cached --check
          git commit -m "Fix generated webclient build module"
          git push origin HEAD:master
