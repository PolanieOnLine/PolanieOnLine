name: Apply optional creature armor override

on:
  push:
    branches:
      - feature/creature-armor-weapon-matchups
    paths:
      - .github/workflows/apply-creature-armor-override.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/creature-armor-weapon-matchups
      - name: Apply armor override support
        run: python3 buildtools/apply_creature_armor_override_patch.py
      - name: Commit implementation
        run: |
          git config user.name "PolanieOnLine CI"
          git config user.email "50992387+PolanieOnLine@users.noreply.github.com"
          git add src data/conf
          git commit -m "feat(creature): add optional armor override with DEF fallback"
          git push origin HEAD:feature/creature-armor-weapon-matchups
