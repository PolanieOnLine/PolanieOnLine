name: Apply dragon and celestial armor classification

on:
  push:
    branches:
      - feature/creature-armor-weapon-matchups
    paths:
      - '.github/workflows/apply-dragon-celestial-armor-classification.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/creature-armor-weapon-matchups
          fetch-depth: 0
      - name: Apply classification
        run: python3 .github/scripts/apply_dragon_celestial_armor_classification.py
      - name: Remove one-shot files
        run: |
          rm .github/scripts/apply_dragon_celestial_armor_classification.py
          rm .github/workflows/apply-dragon-celestial-armor-classification.yml
      - name: Commit implementation and cleanup
        run: |
          git config user.name 'PolanieOnLine'
          git config user.email '50992387+PolanieOnLine@users.noreply.github.com'
          git add data/conf/creatures/stendhal/dragon.xml data/conf/creatures/pol/dragon.xml data/conf/creatures/stendhal/angel.xml data/conf/creatures/pol/angel.xml .github/scripts/apply_dragon_celestial_armor_classification.py .github/workflows/apply-dragon-celestial-armor-classification.yml
          git commit -m 'content(creatures): classify dragons and celestials'
          git push origin HEAD:feature/creature-armor-weapon-matchups
