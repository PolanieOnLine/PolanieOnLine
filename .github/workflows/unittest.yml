name: Java CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: Apply item damage and tooltip changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/item-tooltip-dps-ui'
        env:
          PATCH_B64: 
        run: |
          if grep -q 'entity.addAttribute("damage_min"' src/games/stendhal/server/entity/item/Item.java; then
            echo "Requested changes already applied."
            exit 0
          fi
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/item-tooltip.patch
          git apply /tmp/item-tooltip.patch
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src tests
          git commit -m "Add ranged weapon damage and compact tooltip"
          git push origin HEAD:feature/item-tooltip-dps-ui
      - name: Set up JDK 8
        uses: actions/setup-java@v2
        with:
          java-version: '8'
          distribution: 'adopt'
      - name: Build with Ant xvfb
        uses: GabrielBB/xvfb-action@v1
        env:
          cikey: ${{ secrets.cikey }}
        with:
          run: ant -noinput -buildfile build.xml test
      - name: Print failed JUnit reports
        if: failure()
        run: |
          find build/build_test_report -maxdepth 1 -type f -name 'TEST-*.xml' -print0 2>/dev/null \
            | xargs -0 grep -lE '<failure|<error' 2>/dev/null \
            | while read report; do
                echo "===== ${report} ====="
                cat "${report}"
              done
      - uses: sarisia/actions-status-discord@v1
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_DEVELOPMENT }}
        with:
          nodetail: true
          title: "Unittest failed"
          description: "https://s1.polanieonline.eu/development/cireport.html"
          ack_no_webhook: true
      - uses: sarisia/actions-status-discord@v1
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_DEVLOG }}
        with:
          nodetail: true
          title: "Unittest failed"
          description: "https://s1.polanieonline.eu/development/cireport.html"
          ack_no_webhook: true
