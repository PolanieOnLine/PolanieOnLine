name: CI

on: [push, pull_request]

jobs:
  android-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0"
      - name: Check native login and registration scripts
        run: node --test app/android/tests/native-forms.test.cjs
      - name: Build and check unsigned Android release
        working-directory: app/android
        run: bash gradlew --no-daemon --console=plain -Dorg.gradle.java.home="$JAVA_HOME" -Dandroid.home="$ANDROID_HOME" :client:assembleRelease :client:testReleaseUnitTest :client:lintRelease
      - name: Upload Android verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-verification
          path: |
            build/build_android_client/reports/tests/testReleaseUnitTest/
            build/build_android_client/reports/lint-results-release.*

  webclient-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Compile TypeScript webclient
        run: ant -noinput -buildfile build.xml compilejs
      - name: Check inventory animation and sprite preparation
        run: npm run test:inventory
      - name: Check quest marker rendering
        run: npm run test:quest-markers

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'
      - name: Install Xvfb
        run: sudo apt-get install -y xvfb
      - name: Build with Ant xvfb
        env:
          cikey: ${{ secrets.cikey }}
        run: xvfb-run --auto-servernum ant -noinput -buildfile build.xml test
      - name: Print failed JUnit reports
        if: failure()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path('build/build_test_report/testresults.xml')
          if not report.exists():
              print('JUnit aggregate report not found.')
              raise SystemExit(0)

          root = ET.parse(str(report)).getroot()
          found = False
          for testcase in root.iter('testcase'):
              problems = list(testcase.findall('failure')) + list(testcase.findall('error'))
              for problem in problems:
                  found = True
                  suite = testcase.get('classname', '')
                  name = testcase.get('name', '')
                  print('===== %s.%s =====' % (suite, name))
                  if problem.get('message'):
                      print(problem.get('message'))
                  if problem.text:
                      print(problem.text.strip())
          if not found:
              print('No failure/error nodes found in aggregate report.')
          PY
      - uses: sarisia/actions-status-discord@v1
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_DEVELOPMENT }}
        with:
          nodetail: true
          title: "Unittest failed"
          description: "https://s1.polanieonline.eu/development/cireport.html"
          ack_no_webhook: true
      - uses: sarisia/actions-status-discord@v1
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_DEVLOG }}
        with:
          nodetail: true
          title: "Unittest failed"
          description: "https://s1.polanieonline.eu/development/cireport.html"
          ack_no_webhook: true
