name: Java CI

on: [push, pull_request]

jobs:
  release-regressions:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'
      - name: Install Xvfb
        run: sudo apt-get install -y xvfb
      - name: Run release 1.42 regressions
        run: xvfb-run --auto-servernum ant -noinput -buildfile build.xml test_142

  balance-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'
      - name: Install Xvfb
        run: sudo apt-get install -y xvfb
      - name: Run BalanceRPGame audit for levels 0-30
        env:
          ANT_OPTS: -Dbalance.maxLevel=30 -Dbalance.rounds=100 -Dbalance.reportOnly=true -Dbalance.profile=expected
        run: |
          set -o pipefail
          xvfb-run --auto-servernum ant -noinput -buildfile build.xml -Dcreature= balance | tee balance-results.txt
      - name: Audit low-level safety with weak gear
        env:
          ANT_OPTS: -Dbalance.maxLevel=9 -Dbalance.rounds=100 -Dbalance.reportOnly=true -Dbalance.profile=weak
        run: |
          set -o pipefail
          xvfb-run --auto-servernum ant -noinput -buildfile build.xml -Dcreature= balance | tee balance-results-weak-low.txt
      - name: Generate low-level balance proposals
        env:
          ANT_OPTS: -Dbalance.maxLevel=10 -Dbalance.rounds=100 -Dbalance.reportOnly=false -Dbalance.profile=expected -Dbalance.hardenEasy=false
        run: |
          set -o pipefail
          xvfb-run --auto-servernum ant -noinput -buildfile build.xml -Dcreature= balance | tee balance-proposals-low.txt
      - name: Upload balance results
        uses: actions/upload-artifact@v4
        with:
          name: balance-results
          path: |
            balance-results.txt
            balance-results-weak-low.txt
            balance-proposals-low.txt

  endgame-balance-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'
      - name: Install Xvfb
        run: sudo apt-get install -y xvfb
      - name: Prepare golden ciupaga endgame audit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/games/stendhal/tools/EndgameBalanceAudit.java')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'set used by the achievement plus the mithril dagger.',
              'set used by the achievement plus the golden ciupaga with three moustaches.')
          text = text.replace(
              '"sztylecik z mithrilu"',
              '"złota ciupaga z trzema wąsami"')
          needle = '''\t\tif (item == null) {\n\t\t\tthrow new IllegalStateException("Missing configured endgame item: "\n\t\t\t\t\t+ itemName);\n\t\t}\n'''
          replacement = needle + '''\t\tif ("złota ciupaga z trzema wąsami".equals(itemName)\n\t\t\t\t&& !item.has("lifesteal")) {\n\t\t\t// Existing pre-1.42 ciupagas keep their authored 10% lifesteal.\n\t\t\titem.put("lifesteal", 0.1);\n\t\t}\n'''
          if needle not in text:
              raise SystemExit('Could not patch equip() for legacy lifesteal')
          path.write_text(text.replace(needle, replacement), encoding='utf-8')
          PY
      - name: Audit endgame mithril loadouts with golden ciupaga
        env:
          ANT_OPTS: -Dbalance.endgame.playerLevel=350 -Dbalance.endgame.minLevel=250 -Dbalance.endgame.maxLevel=500 -Dbalance.endgame.rounds=30 -Dbalance.endgame.attritionSeries=10 -Dbalance.endgame.attritionFights=5
        run: |
          set -o pipefail
          xvfb-run --auto-servernum ant -noinput -buildfile build.xml balance_endgame | tee balance-endgame-mithril.txt
      - name: Upload endgame balance results
        uses: actions/upload-artifact@v4
        with:
          name: balance-endgame-mithril
          path: |
            balance-endgame-mithril.txt
            src/games/stendhal/tools/EndgameBalanceAudit.java

  build:
    needs: release-regressions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'
      - name: Install Xvfb
        run: sudo apt-get install -y xvfb
      - name: Build with Ant xvfb
        env:
          cikey: ${{ secrets.cikey }}
        run: xvfb-run --auto-servernum ant -noinput -buildfile build.xml test
      - name: Print failed JUnit reports
        if: failure()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path('build/build_test_report/testresults.xml')
          if not report.exists():
              print('JUnit aggregate report not found.')
              raise SystemExit(0)

          root = ET.parse(str(report)).getroot()
          found = False
          for testcase in root.iter('testcase'):
              problems = list(testcase.findall('failure')) + list(testcase.findall('error'))
              for problem in problems:
                  found = True
                  suite = testcase.get('classname', '')
                  name = testcase.get('name', '')
                  print('===== %s.%s =====' % (suite, name))
                  if problem.get('message'):
                      print(problem.get('message'))
                  if problem.text:
                      print(problem.text.strip())
          if not found:
              print('No failure/error nodes found in aggregate report.')
          PY
      - uses: sarisia/actions-status-discord@v1
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_DEVELOPMENT }}
        with:
          nodetail: true
          title: "Unittest failed"
          description: "https://s1.polanieonline.eu/development/cireport.html"
          ack_no_webhook: true
      - uses: sarisia/actions-status-discord@v1
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_DEVLOG }}
        with:
          nodetail: true
          title: "Unittest failed"
          description: "https://s1.polanieonline.eu/development/cireport.html"
          ack_no_webhook: true
