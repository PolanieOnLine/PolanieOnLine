name: Java CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 8
        uses: actions/setup-java@v2
        with:
          java-version: '8'
          distribution: 'adopt'
      - name: Build with Ant xvfb
        uses: GabrielBB/xvfb-action@v1
        env:
          cikey: ${{ secrets.cikey }}
        with:
          run: ant -noinput -buildfile build.xml test
      - name: Print failed JUnit reports
        if: failure()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path('build/build_test_report/testresults.xml')
          if not report.exists():
              print('JUnit aggregate report not found.')
              raise SystemExit(0)

          root = ET.parse(str(report)).getroot()
          found = False
          for testcase in root.iter('testcase'):
              problems = list(testcase.findall('failure')) + list(testcase.findall('error'))
              for problem in problems:
                  found = True
                  suite = testcase.get('classname', '')
                  name = testcase.get('name', '')
                  print('===== %s.%s =====' % (suite, name))
                  if problem.get('message'):
                      print(problem.get('message'))
                  if problem.text:
                      print(problem.text.strip())
          if not found:
              print('No failure/error nodes found in aggregate report.')
          PY
      - uses: sarisia/actions-status-discord@v1
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_DEVELOPMENT }}
        with:
          nodetail: true
          title: "Unittest failed"
          description: "https://s1.polanieonline.eu/development/cireport.html"
          ack_no_webhook: true
      - uses: sarisia/actions-status-discord@v1
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_DEVLOG }}
        with:
          nodetail: true
          title: "Unittest failed"
          description: "https://s1.polanieonline.eu/development/cireport.html"
          ack_no_webhook: true
