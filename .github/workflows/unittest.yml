name: Java CI

on: [push, pull_request]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
        with:
          ref: feature/item-tooltip-dps-ui
      - name: Apply staged item resistance tooltip patch
        if: ${{ hashFiles('.github/scripts/apply_item_resistance_tooltip_patch.py') != '' }}
        run: |
          python3 .github/scripts/apply_item_resistance_tooltip_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/games/stendhal/client/gui/ItemRarityPresentation.java \
                  tests/games/stendhal/client/gui/ItemRarityPresentationTest.java
          if ! git diff --cached --quiet; then
            git commit -m "fix(client): finalize defensive item tooltip"
            git push origin HEAD:feature/item-tooltip-dps-ui
          fi
      - name: Set up JDK 8
        uses: actions/setup-java@v2
        with:
          java-version: '8'
          distribution: 'adopt'
      - name: Build with Ant xvfb
        uses: GabrielBB/xvfb-action@v1
        env:
          cikey: ${{ secrets.cikey }}
        with:
          run: ant -noinput -buildfile build.xml test
      - name: Print failed JUnit reports
        if: failure()
        run: |
          find build/build_test_report -maxdepth 1 -type f -name 'TEST-*.xml' -print0 2>/dev/null \
            | xargs -0 grep -lE '<failure|<error' 2>/dev/null \
            | while read report; do
                echo "===== ${report} ====="
                cat "${report}"
              done
      - uses: sarisia/actions-status-discord@v1
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_DEVELOPMENT }}
        with:
          nodetail: true
          title: "Unittest failed"
          description: "https://s1.polanieonline.eu/development/cireport.html"
          ack_no_webhook: true
      - uses: sarisia/actions-status-discord@v1
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_DEVLOG }}
        with:
          nodetail: true
          title: "Unittest failed"
          description: "https://s1.polanieonline.eu/development/cireport.html"
          ack_no_webhook: true
