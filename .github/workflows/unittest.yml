name: Java CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: Package maintenance sources
        run: |
          tar -czf maintenance-sources.tgz \
            src/games/stendhal/server/entity/item/Item.java \
            src/games/stendhal/server/entity/RPEntity.java \
            src/games/stendhal/server/entity/item/ItemTooltipService.java \
            src/games/stendhal/server/core/rule/rarity/ItemRarityService.java \
            src/games/stendhal/client/gui/ItemRarityPresentation.java \
            src/games/stendhal/client/gui/WeaponPerformanceCalculator.java \
            src/games/stendhal/common/constants/ItemTooltip.java \
            tests/games/stendhal/server/entity/item/ItemTest.java \
            tests/games/stendhal/client/gui/ItemRarityPresentationTest.java \
            tests/games/stendhal/client/gui/WeaponPerformanceCalculatorTest.java \
            .github/workflows/unittest.yml
      - name: Upload maintenance sources
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-sources
          path: maintenance-sources.tgz
          retention-days: 1
      - name: Set up JDK 8
        uses: actions/setup-java@v2
        with:
          java-version: '8'
          distribution: 'adopt'
      - name: Build with Ant xvfb
        uses: GabrielBB/xvfb-action@v1
        env:
          cikey: ${{ secrets.cikey }}
        with:
          run: ant -noinput -buildfile build.xml test
      - name: Print failed JUnit reports
        if: failure()
        run: |
          find build/build_test_report -maxdepth 1 -type f -name 'TEST-*.xml' -print0 2>/dev/null \
            | xargs -0 grep -lE '<failure|<error' 2>/dev/null \
            | while read report; do
                echo "===== ${report} ====="
                cat "${report}"
              done
      - uses: sarisia/actions-status-discord@v1
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_DEVELOPMENT }}
        with:
          nodetail: true
          title: "Unittest failed"
          description: "https://s1.polanieonline.eu/development/cireport.html"
          ack_no_webhook: true
      - uses: sarisia/actions-status-discord@v1
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_DEVLOG }}
        with:
          nodetail: true
          title: "Unittest failed"
          description: "https://s1.polanieonline.eu/development/cireport.html"
          ack_no_webhook: true
