name: Apply semantic creature armor patch

on:
  push:
    branches:
      - feature/creature-armor-weapon-matchups
    paths:
      - .github/workflows/apply-semantic-creature-armor-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/creature-armor-weapon-matchups
      - name: Apply semantic creature armor patch
        run: python3 buildtools/apply_semantic_creature_armor_patch.py
      - name: Remove one-shot patch files
        run: rm .github/workflows/apply-semantic-creature-armor-patch.yml buildtools/apply_semantic_creature_armor_patch.py
      - name: Commit implementation and cleanup
        run: |
          git config user.name "PolanieOnLine CI"
          git config user.email "50992387+PolanieOnLine@users.noreply.github.com"
          git add data/conf src tests .github/workflows buildtools
          git commit -m "feat(creature): use semantic armor tiers"
          git push origin HEAD:feature/creature-armor-weapon-matchups
