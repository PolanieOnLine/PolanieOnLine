name: Apply imperial defender armor classification

on:
  push:
    branches:
      - feature/creature-armor-weapon-matchups
    paths:
      - '.github/workflows/apply-imperial-defender-armor.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/creature-armor-weapon-matchups
          fetch-depth: 0
      - name: Apply classification
        run: python3 .github/scripts/apply_imperial_defender_armor.py
      - name: Remove one-shot files
        run: |
          rm .github/scripts/apply_imperial_defender_armor.py
          rm .github/workflows/apply-imperial-defender-armor.yml
      - name: Commit implementation and cleanup
        run: |
          git config user.name 'PolanieOnLine'
          git config user.email '50992387+PolanieOnLine@users.noreply.github.com'
          git add data/conf/creatures/stendhal/human_imperial.xml .github/scripts/apply_imperial_defender_armor.py .github/workflows/apply-imperial-defender-armor.yml
          git commit -m 'content(creatures): classify imperial defender armor'
          git push origin HEAD:feature/creature-armor-weapon-matchups
