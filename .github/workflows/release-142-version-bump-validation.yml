name: Release 1.42 version bump validation

on:
  push:
    branches:
      - release/bump-version-1-42

permissions:
  contents: write

jobs:
  validate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
      - name: Apply final 1.42 version
        run: |
          python3 - <<'PY'
          from pathlib import Path

          text_files = [
              'bin/runserver.sh',
              'bin/runserver.bat',
              'src/games/stendhal/common/Debug.java',
              'buildtools/mkdocs/mkdocs.yml',
              'src/games/stendhal/client/update/HttpClient.java',
              'app/neutralinojs/neutralino.config.json',
              'app/android/client/src/main/res/values/strings.xml',
          ]
          for path in text_files:
              p = Path(path)
              s = p.read_text()
              if s.count('1.41.5') != 1:
                  raise SystemExit('%s: expected exactly one 1.41.5 occurrence, got %d' % (path, s.count('1.41.5')))
              p.write_text(s.replace('1.41.5', '1.42', 1))

          p = Path('build.ant.properties')
          s = p.read_text()
          replacements = {
              'version     = 1.41.5': 'version     = 1.42',
              'version.android = 1041005': 'version.android = 1042000',
          }
          for old, new in replacements.items():
              if s.count(old) != 1:
                  raise SystemExit('build.ant.properties: expected one %r' % old)
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('app/android/client/build.gradle')
          s = p.read_text()
          replacements = {
              'versionCode 1041005': 'versionCode 1042000',
              'versionName "1.41.5"': 'versionName "1.42"',
          }
          for old, new in replacements.items():
              if s.count(old) != 1:
                  raise SystemExit('Android build.gradle: expected one %r' % old)
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Validate version metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          assert 'version     = 1.42' in Path('build.ant.properties').read_text()
          assert 'version.old = 1.41' in Path('build.ant.properties').read_text()
          assert 'version.android = 1042000' in Path('build.ant.properties').read_text()
          assert json.loads(Path('app/neutralinojs/neutralino.config.json').read_text())['version'] == '1.42'
          ET.parse('app/android/client/src/main/res/values/strings.xml')
          gradle = Path('app/android/client/build.gradle').read_text()
          assert 'versionCode 1042000' in gradle
          assert 'versionName "1.42"' in gradle
          PY
          bash -n bin/runserver.sh
          files=(
            bin/runserver.sh
            bin/runserver.bat
            src/games/stendhal/common/Debug.java
            buildtools/mkdocs/mkdocs.yml
            src/games/stendhal/client/update/HttpClient.java
            app/neutralinojs/neutralino.config.json
            build.ant.properties
            app/android/client/src/main/res/values/strings.xml
            app/android/client/build.gradle
          )
          if grep -n -F '1.41.5' "${files[@]}"; then
            echo 'Old active release version remains.'
            exit 1
          fi
      - name: Build 1.42 server distribution
        run: |
          ant -noinput -buildfile build.xml dist_server_binary
          test -f build/polanieonline-server-1.42.zip
          unzip -l build/polanieonline-server-1.42.zip | grep -F 'polanieonline-server-1.42.jar'
      - name: Commit validated version bump
        run: |
          rm .github/workflows/release-142-version-bump-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A bin/runserver.sh bin/runserver.bat src/games/stendhal/common/Debug.java buildtools/mkdocs/mkdocs.yml src/games/stendhal/client/update/HttpClient.java app/neutralinojs/neutralino.config.json build.ant.properties app/android/client/src/main/res/values/strings.xml app/android/client/build.gradle .github/workflows/release-142-version-bump-validation.yml
          git commit -m 'Ustaw finalną wersję 1.42'
          git push origin HEAD:release/bump-version-1-42
