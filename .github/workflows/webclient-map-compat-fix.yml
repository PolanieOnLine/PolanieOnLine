name: Temporary webclient map compatibility fix

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Restore map compatibility
        run: |
          set -euo pipefail
          git show 9bb461cd61e441e0835096938c5f3939b121f39f:src/js/stendhal/landscape/TileLayerPainter.ts > src/js/stendhal/landscape/TileLayerPainter.ts
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/js/stendhal/data/TileMap.ts')
          text = path.read_text()
          old = '''\tstatic get(): TileMap {\n\t\tif (!TileMap.instance) {\n\t\t\tTileMap.instance = new TileMap();\n\t\t}\n\t\treturn TileMap.instance;\n\t}\n'''
          new = '''\tstatic get(): TileMap {\n\t\tif (!TileMap.instance) {\n\t\t\tTileMap.instance = new TileMap();\n\t\t}\n\t\t// Keep the legacy stendhal.data.map alias while older webclient code is migrated.\n\t\tstendhal.data = stendhal.data || {};\n\t\tstendhal.data.map = TileMap.instance;\n\t\treturn TileMap.instance;\n\t}\n'''
          if text.count(old) != 1:
              raise SystemExit('Expected TileMap.get() block exactly once')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          git diff -- src/js/stendhal/data/TileMap.ts src/js/stendhal/landscape/TileLayerPainter.ts
      - name: Commit compatibility fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/js/stendhal/data/TileMap.ts src/js/stendhal/landscape/TileLayerPainter.ts
          git commit -m "Restore webclient map compatibility"
          git push origin HEAD:master
