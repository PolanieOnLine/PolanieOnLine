name: Temporary webclient UI parity fix

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply UI fixes
        run: python3 .github/scripts/fix_webclient_ui_parity.py

      - name: Validate diff
        run: |
          git diff --check
          git diff -- src/js/stendhal/ui/component/ItemTooltipPresentation.ts \
                     src/js/stendhal/ui/component/ItemContainerImplementation.ts \
                     src/js/stendhal/ui/LeftPanelToggleController.ts \
                     src/js/stendhal/ui/RightPanelToggleController.ts \
                     src/js/css/main.css

      - name: Compile webclient
        run: ant -noinput -buildfile build.xml compilejs

      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/js/stendhal/ui/component/ItemTooltipPresentation.ts \
                  src/js/stendhal/ui/component/ItemContainerImplementation.ts \
                  src/js/stendhal/ui/LeftPanelToggleController.ts \
                  src/js/stendhal/ui/RightPanelToggleController.ts \
                  src/js/css/main.css
          git commit -m "Fix webclient item UI and mobile panels"
          git push origin HEAD:master
