name: Apply creature armor implementation

on:
  push:
    branches:
      - feature/creature-armor-weapon-matchups
    paths:
      - .github/workflows/apply-creature-armor.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/creature-armor-weapon-matchups
      - name: Apply implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Creature XML loader
          replace_once(
              'src/games/stendhal/server/core/config/CreaturesXMLLoader.java',
              '\tprivate int def;\n\tprivate int hp;',
              '\tprivate int def;\n\tprivate int armor;\n\tprivate int hp;')
          replace_once(
              'src/games/stendhal/server/core/config/CreaturesXMLLoader.java',
              '\t\t\tstatusAttackProbability = 0;\n',
              '\t\t\tstatusAttackProbability = 0;\n\t\t\tarmor = 0;\n')
          replace_once(
              'src/games/stendhal/server/core/config/CreaturesXMLLoader.java',
              '\t\t\t} else if (qName.equals("def")) {\n\t\t\t\tdef = Integer.parseInt(attrs.getValue("value"));\n\t\t\t} else if (qName.equals("hp")) {',
              '\t\t\t} else if (qName.equals("def")) {\n\t\t\t\tdef = Integer.parseInt(attrs.getValue("value"));\n\t\t\t} else if (qName.equals("armor")) {\n\t\t\t\tarmor = Integer.parseInt(attrs.getValue("value"));\n\t\t\t} else if (qName.equals("hp")) {')
          replace_once(
              'src/games/stendhal/server/core/config/CreaturesXMLLoader.java',
              '\t\t\tcreature.setRPStats(hp, atk, ratk, def, speed);\n\t\t\tcreature.setLevel(level, xp);',
              '\t\t\tcreature.setRPStats(hp, atk, ratk, def, speed);\n\t\t\tcreature.setArmor(armor);\n\t\t\tcreature.setLevel(level, xp);')

          # Definition model
          replace_once(
              'src/games/stendhal/server/core/rule/defaultruleset/DefaultCreature.java',
              '\t/** defense points. */\n\tprivate int def;\n\t/** experience points for killing this creature. */',
              '\t/** defense points. */\n\tprivate int def;\n\t/** Physical armor used for weapon-class matchups. */\n\tprivate int armor;\n\t/** experience points for killing this creature. */')
          replace_once(
              'src/games/stendhal/server/core/rule/defaultruleset/DefaultCreature.java',
              '\tpublic int getDef() {\n\t\treturn def;\n\t}\n\n\tpublic double getSpeed() {',
              '\tpublic int getDef() {\n\t\treturn def;\n\t}\n\n\tpublic void setArmor(final int armor) {\n\t\tthis.armor = Math.max(0, armor);\n\t}\n\n\tpublic int getArmor() {\n\t\treturn armor;\n\t}\n\n\tpublic double getSpeed() {')
          replace_once(
              'src/games/stendhal/server/core/rule/defaultruleset/DefaultCreature.java',
              '\t\tfinal Creature creature = new Creature(clazz, subclass, name, hp, atk, ratk, def,\n\t\t\t\tlevel, xp, width, height, speed, resistance, visibility, dropsItems, aiProfiles,\n\t\t\t\tcreatureSays, respawn, description);\n\t\tcreature.equip(equipsItems);',
              '\t\tfinal Creature creature = new Creature(clazz, subclass, name, hp, atk, ratk, def,\n\t\t\t\tlevel, xp, width, height, speed, resistance, visibility, dropsItems, aiProfiles,\n\t\t\t\tcreatureSays, respawn, description);\n\t\tcreature.setArmor(armor);\n\t\tcreature.equip(equipsItems);')
          replace_once(
              'src/games/stendhal/server/core/rule/defaultruleset/DefaultCreature.java',
              '\t\tos.append("      <def value=\\\"" + def + "\\\"/>\\n");\n\t\tos.append("      <hp value=\\\"" + hp + "\\\"/>\\n");',
              '\t\tos.append("      <def value=\\\"" + def + "\\\"/>\\n");\n\t\tif (armor > 0) {\n\t\t\tos.append("      <armor value=\\\"" + armor + "\\\"/>\\n");\n\t\t}\n\t\tos.append("      <hp value=\\\"" + hp + "\\\"/>\\n");')

          # Runtime creature state
          replace_once(
              'src/games/stendhal/server/entity/creature/Creature.java',
              '\t\tthis.statusAttackers = copy.statusAttackers;\n\t\tthis.noises = copy.noises;\n',
              '\t\tthis.statusAttackers = copy.statusAttackers;\n\t\tthis.noises = copy.noises;\n\t\tsetArmor(copy.getArmor());\n')
          replace_once(
              'src/games/stendhal/server/entity/creature/Creature.java',
              '\tpublic Creature getNewInstance() {\n\t\treturn new Creature(this);\n\t}\n',
              '\tpublic void setArmor(final int armor) {\n\t\tif (armor > 0) {\n\t\t\tput("armor", Math.min(Short.MAX_VALUE, armor));\n\t\t} else if (has("armor")) {\n\t\t\tremove("armor");\n\t\t}\n\t}\n\n\tpublic int getArmor() {\n\t\treturn has("armor") ? Math.max(0, getInt("armor")) : 0;\n\t}\n\n\tpublic Creature getNewInstance() {\n\t\treturn new Creature(this);\n\t}\n')
          replace_once(
              'src/games/stendhal/server/entity/creature/Creature.java',
              '\t\t\tnpc.addAttribute("debug", Type.VERY_LONG_STRING,\n\t\t\t\t\tDefinition.VOLATILE);\n\t\t\tnpc.addAttribute("metamorphosis", Type.STRING, Definition.VOLATILE);',
              '\t\t\tnpc.addAttribute("debug", Type.VERY_LONG_STRING,\n\t\t\t\t\tDefinition.VOLATILE);\n\t\t\tnpc.addAttribute("armor", Type.SHORT, Definition.HIDDEN);\n\t\t\tnpc.addAttribute("metamorphosis", Type.STRING, Definition.VOLATILE);')

          # XML schema
          replace_once(
              'data/conf/creatures.xsd',
              '\t\t\t<xsd:element name="def" minOccurs="1">\n\t\t\t\t<xsd:complexType>\n\t\t\t\t\t<xsd:attribute name="value" type="xsd:positiveInteger" />\n\t\t\t\t</xsd:complexType>\n\t\t\t</xsd:element>\n\t\t\t<xsd:element name="hp" minOccurs="1">',
              '\t\t\t<xsd:element name="def" minOccurs="1">\n\t\t\t\t<xsd:complexType>\n\t\t\t\t\t<xsd:attribute name="value" type="xsd:positiveInteger" />\n\t\t\t\t</xsd:complexType>\n\t\t\t</xsd:element>\n\t\t\t<xsd:element name="armor" minOccurs="0" maxOccurs="1">\n\t\t\t\t<xsd:complexType>\n\t\t\t\t\t<xsd:attribute name="value" type="xsd:nonNegativeInteger" use="required" />\n\t\t\t\t</xsd:complexType>\n\t\t\t</xsd:element>\n\t\t\t<xsd:element name="hp" minOccurs="1">')

          # Weapon-class interaction in player combat
          replace_once(
              'src/games/stendhal/server/core/rp/StendhalRPAction.java',
              'import games.stendhal.server.core.engine.GameEvent;\nimport games.stendhal.server.core.engine.SingletonRepository;',
              'import games.stendhal.server.core.engine.GameEvent;\nimport games.stendhal.server.core.engine.SingletonRepository;\nimport games.stendhal.server.core.rule.damage.WeaponArmorInteractionService;')
          replace_once(
              'src/games/stendhal/server/core/rp/StendhalRPAction.java',
              '\t\t\tdamage = player.damageDone(defender, itemAtk, player.getDamageType());',
              '\t\t\tfinal double armorAdjustedItemAtk =\n\t\t\t\t\tWeaponArmorInteractionService.adjustAttack(\n\t\t\t\t\t\t\titemAtk, attackWeapon, defender);\n\t\t\tdamage = player.damageDone(defender, armorAdjustedItemAtk,\n\t\t\t\t\tplayer.getDamageType());')

          service = r'''/***************************************************************************
 *                   (C) Copyright 2003-2026 - Stendhal                    *
 ***************************************************************************/
package games.stendhal.server.core.rule.damage;

import games.stendhal.server.entity.RPEntity;
import games.stendhal.server.entity.creature.Creature;
import games.stendhal.server.entity.item.Item;

/**
 * Applies small, explicit weapon-class advantages against creature armor.
 * Existing DEF remains the general defensive statistic; armor selects the
 * matchup profile and therefore does not double the creature's mitigation.
 */
public final class WeaponArmorInteractionService {
	private static final int LIGHT_ARMOR_MAX = 30;
	private static final int MEDIUM_ARMOR_MAX = 80;

	private WeaponArmorInteractionService() {
		// utility class
	}

	public enum ArmorTier {
		NONE,
		LIGHT,
		MEDIUM,
		HEAVY
	}

	/**
	 * Adjusts only the primary weapon contribution. Bonuses from rings, glyphs
	 * and other equipment stay neutral and are not incorrectly treated as the
	 * weapon itself.
	 */
	public static double adjustAttack(final double totalItemAttack,
			final Item primaryWeapon, final RPEntity defender) {
		if (primaryWeapon == null || !(defender instanceof Creature)) {
			return totalItemAttack;
		}

		final int armor = ((Creature) defender).getArmor();
		final double multiplier = getDamageMultiplier(
				primaryWeapon.getWeaponType(), armor);
		final double weaponContribution = Math.max(0.0,
				primaryWeapon.getAverageDamage());
		return Math.max(0.0, totalItemAttack
				+ weaponContribution * (multiplier - 1.0));
	}

	public static ArmorTier classify(final int armor) {
		if (armor <= 0) {
			return ArmorTier.NONE;
		}
		if (armor <= LIGHT_ARMOR_MAX) {
			return ArmorTier.LIGHT;
		}
		if (armor <= MEDIUM_ARMOR_MAX) {
			return ArmorTier.MEDIUM;
		}
		return ArmorTier.HEAVY;
	}

	public static double getDamageMultiplier(final String weaponClass,
			final int armor) {
		if (weaponClass == null) {
			return 1.0;
		}

		final ArmorTier tier = classify(armor);
		if ("dagger".equals(weaponClass)) {
			return daggerMultiplier(tier);
		}
		if ("sword".equals(weaponClass)) {
			return swordMultiplier(tier);
		}
		if ("axe".equals(weaponClass) || "club".equals(weaponClass)) {
			return armorBreakerMultiplier(tier);
		}
		return 1.0;
	}

	private static double daggerMultiplier(final ArmorTier tier) {
		switch (tier) {
		case NONE:
		case LIGHT:
			return 1.10;
		case MEDIUM:
			return 0.95;
		case HEAVY:
			return 0.80;
		default:
			return 1.0;
		}
	}

	private static double swordMultiplier(final ArmorTier tier) {
		switch (tier) {
		case MEDIUM:
			return 1.10;
		case HEAVY:
			return 0.95;
		default:
			return 1.0;
		}
	}

	private static double armorBreakerMultiplier(final ArmorTier tier) {
		switch (tier) {
		case NONE:
		case LIGHT:
			return 0.95;
		case HEAVY:
			return 1.15;
		default:
			return 1.0;
		}
	}
}
'''
          service_path = Path('src/games/stendhal/server/core/rule/damage/WeaponArmorInteractionService.java')
          service_path.parent.mkdir(parents=True, exist_ok=True)
          service_path.write_text(service, encoding='utf-8')

          test = r'''/***************************************************************************
 *                   (C) Copyright 2003-2026 - Stendhal                    *
 ***************************************************************************/
package games.stendhal.server.core.rule.damage;

import static org.junit.Assert.assertEquals;
import static org.junit.Assert.assertTrue;

import org.junit.Test;

import games.stendhal.server.core.rule.damage.WeaponArmorInteractionService.ArmorTier;

public class WeaponArmorInteractionServiceTest {
	@Test
	public void classifiesArmorTiers() {
		assertEquals(ArmorTier.NONE,
				WeaponArmorInteractionService.classify(0));
		assertEquals(ArmorTier.LIGHT,
				WeaponArmorInteractionService.classify(30));
		assertEquals(ArmorTier.MEDIUM,
				WeaponArmorInteractionService.classify(31));
		assertEquals(ArmorTier.MEDIUM,
				WeaponArmorInteractionService.classify(80));
		assertEquals(ArmorTier.HEAVY,
				WeaponArmorInteractionService.classify(81));
	}

	@Test
	public void daggerIsBestAgainstLightArmor() {
		final double dagger = multiplier("dagger", 20);
		assertTrue(dagger > multiplier("sword", 20));
		assertTrue(dagger > multiplier("axe", 20));
	}

	@Test
	public void swordIsBestAgainstMediumArmor() {
		final double sword = multiplier("sword", 50);
		assertTrue(sword > multiplier("dagger", 50));
		assertTrue(sword > multiplier("axe", 50));
	}

	@Test
	public void axeAndClubAreBestAgainstHeavyArmor() {
		final double axe = multiplier("axe", 100);
		final double club = multiplier("club", 100);
		assertEquals(axe, club, 0.0);
		assertTrue(axe > multiplier("sword", 100));
		assertTrue(axe > multiplier("dagger", 100));
	}

	@Test
	public void unsupportedWeaponClassRemainsNeutral() {
		assertEquals(1.0, multiplier("wand", 100), 0.0);
		assertEquals(1.0, multiplier(null, 100), 0.0);
	}

	private double multiplier(final String weaponClass, final int armor) {
		return WeaponArmorInteractionService.getDamageMultiplier(
				weaponClass, armor);
	}
}
'''
          test_path = Path('tests/games/stendhal/server/core/rule/damage/WeaponArmorInteractionServiceTest.java')
          test_path.parent.mkdir(parents=True, exist_ok=True)
          test_path.write_text(test, encoding='utf-8')

          creature_test = r'''/***************************************************************************
 *                   (C) Copyright 2003-2026 - Stendhal                    *
 ***************************************************************************/
package games.stendhal.server.entity.creature;

import static org.junit.Assert.assertEquals;

import org.junit.BeforeClass;
import org.junit.Test;

import utilities.RPClass.CreatureTestHelper;

public class CreatureArmorTest {
	@BeforeClass
	public static void generateRPClasses() {
		CreatureTestHelper.generateRPClasses();
	}

	@Test
	public void storesAndCopiesArmor() {
		final Creature template = new Creature();
		template.setArmor(75);

		final Creature copy = new Creature(template);

		assertEquals(75, template.getArmor());
		assertEquals(75, copy.getArmor());
	}

	@Test
	public void negativeArmorBecomesUnarmored() {
		final Creature creature = new Creature();
		creature.setArmor(-10);
		assertEquals(0, creature.getArmor());
	}
}
'''
          creature_test_path = Path('tests/games/stendhal/server/entity/creature/CreatureArmorTest.java')
          creature_test_path.parent.mkdir(parents=True, exist_ok=True)
          creature_test_path.write_text(creature_test, encoding='utf-8')

          # Pilot: representative light, medium and heavy orcs.
          orc_path = Path('data/conf/creatures/stendhal/orc.xml')
          orc_xml = orc_path.read_text(encoding='utf-8')
          for creature_name, armor_value in [
                  ('ork', 12),
                  ('ork włócznik', 20),
                  ('ork łowca', 50),
                  ('ork wojownik', 50),
                  ('szef orków', 100)]:
              pattern = (r'(<creature name="' + re.escape(creature_name)
                         + r'">.*?<def value="\d+"/>)')
              replacement = r'\1\n\t\t\t<armor value="' + str(armor_value) + r'"/>'
              orc_xml, count = re.subn(pattern, replacement, orc_xml,
                                       count=1, flags=re.DOTALL)
              if count != 1:
                  raise RuntimeError(f'Could not add armor to {creature_name}')
          orc_path.write_text(orc_xml, encoding='utf-8')
          PY
