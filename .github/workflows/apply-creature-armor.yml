name: Apply creature armor implementation

on:
  push:
    branches:
      - feature/creature-armor-weapon-matchups
    paths:
      - .github/workflows/apply-creature-armor.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/creature-armor-weapon-matchups
      - name: Apply combat integration
        run: python3 buildtools/apply_creature_armor_patch.py
      - name: Commit integration
        run: |
          git config user.name "PolanieOnLine CI"
          git config user.email "50992387+PolanieOnLine@users.noreply.github.com"
          git add src
          git commit -m "feat(combat): integrate creature armor matchups"
          git push origin HEAD:feature/creature-armor-weapon-matchups
