name: Apply weapon armor roll patch

on:
  push:
    branches:
      - feature/creature-armor-weapon-matchups
    paths:
      - .github/workflows/apply-weapon-armor-roll-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/creature-armor-weapon-matchups
      - name: Apply weapon armor roll patch
        run: python3 buildtools/apply_weapon_armor_roll_patch.py
      - name: Remove one-shot patch files
        run: rm .github/workflows/apply-weapon-armor-roll-patch.yml buildtools/apply_weapon_armor_roll_patch.py
      - name: Commit implementation and cleanup
        run: |
          git config user.name "PolanieOnLine CI"
          git config user.email "50992387+PolanieOnLine@users.noreply.github.com"
          git add src tests .github/workflows buildtools
          git commit -m "feat(combat): apply armor matchups to rolled weapon damage"
          git push origin HEAD:feature/creature-armor-weapon-matchups
